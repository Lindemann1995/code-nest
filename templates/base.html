<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Code Nest{% endblock %}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f7;
            color: #1d1d1f;
            line-height: 1.6;
        }
        header {
            background: #1a1f2e;
            color: #fff;
            padding: 20px 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 a {
            color: #fff;
            text-decoration: none;
            font-size: 24px;
        }
        header h1 a span {
            color: #f5a623
        }
        header nav a {
            color: #ccc;
            text-decoration: none;
            margin-left: 20px;
            transition: color 0.2s;
        }
        header nav a:hover { color: #f5a623; }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
        }
        main {
            padding: 40px 0;
            min-height: calc(100vh - 200px);
        }
        footer {
            background: #1a1f2e;
            color: #999;
            text-align: center;
            padding: 20 px 0;
            font-size: 14px;
        }
        a { color: #0066cc; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .breadcrumb {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
        }
        .breadcrumb a { color: #0066cc; }
        .breadcrumb span { color: #1d1d1f; font-weight: 500; }

        .sections-list, .subsections-list, .topics-list {
            list-style: none;
            padding: 0;
        }
        .sections-list li, .subsections-list li, .topics-list li {
            background: #fff;
            padding: 15px 20px;
            margin-bottom: 10px;
            border-radius: 8px;
            border: 1px solid #e5e5e7;
            transition: box-shadow 0.2s;
        }
        .sections-list li:hover, .subsections-list li:hover, .topics-list li:hover {
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .sections-list a, .subsections-list a, .topics-list a {
            font-size: 18px;
            font-weight: 500;
        }
        .topic-meta, .post-date, .topic-info {
            font-size: 13px;
            color: #666;
            margin-top: 5px;
        }
        .badge {
            display: inline-block;
            font-size: 12px;
            margin-right: 5px;
        }
        .post {
            background: #fff;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #e5e5e7;
        }
        .post-author {
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
        .description {
            color: #555;
            margin-bottom: 20px;
        }
        h3 {
            margin-top: 30px;
            margin-bottom: 15px;
            font-size: 18px;
            color: #333;
        }
        /* Формы авторизации */
        .auth-form {
            max-width: 450px;
            margin: 40px auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            border: 1px solid #e5e5e7;
            box-shadow: 0 2px 12px rgba(0,0,0,0.05);
        }
        .auth-form h2 {
            margin-bottom: 25px;
            font-size: 24px;
        }
        .form-field {
            margin-bottom: 18px;
        }
        .form-field label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 6px;
            color: #333;
        }
        .form-field input {
            width: 100%;
            padding: 10px 12px;
            font-size: 15px;
            border: 1px solid #d1d1d6;
            border-radius: 6px;
            transition: border 0.2s;
            font-family: inherit;
        }
        .form-field input:focus {
            outline: none;
            border-color: #0066cc;
            box-shadow: 0 0 0 3px rgba(0,102,204,0.1);
        }
        .help-text {
            display: block;
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }
        .field-error {
            color: #d32f2f;
            font-size: 13px;
            margin-top: 5px;
        }
        .error-box {
            background: #ffebee;
            color: #c62828;
            padding: 12px 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            border-left: 4px solid #c62828;
        }
        .btn-primary {
            background: #0066cc;
            color: #fff;
            border: none;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
            font-family: inherit;
        }
        .btn-primary:hover {
            background: #0052a3;
        }
        .auth-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }
        .user-info {
            color: #ccc;
            margin-right: 10px;
        }
        .notice {
            background: #fff3e0;
            color: #e65100;
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .logout-btn {
            background: none;
            border: none;
            color: #ccc;
            cursor: pointer;
            font-size: inherit;
            font-family: inherit;
            padding: 0;
            margin-left: 20px;
            transition: color 0.2s;
        }
        .logout-btn:hover {
            color: #f5a623;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1><a href="/">Code<span>Nest</span></a></h1>
            <nav>
                <a href="/">Главная</a>
                {% if user.is_authenticated %}
                    <span class="user-info">Привет, <strong>{{ user.username }}</strong></span>
                {% if user.is_staff %}
                    <a href="/admin/">Админка</a>
                {% endif %}
                    <form method="post" action="{{ url('logout') }}" style="display:inline;">
                    {{ csrf_input|safe }}
                    <button type="submit" class="logout-btn">Выйти</button>
                </form>
                {% else %}
                    <a href="{{ url('login') }}">Войти</a>
                    <a href="{{ url('forum:register') }}">Регистрация</a>
                {% endif %}
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer>
        <div class="container">
            © 2026 Code Nest - Форум для программистов.
        </div>
    </footer>
</body>
</html>
