<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Code Nest{% endblock %}</title>

    <!-- Quill — визуальный редактор -->
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet">

    <!-- highlight.js — подсветка кода -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f7;
            color: #1d1d1f;
            line-height: 1.6;
        }
        header {
            background: #1a1f2e;
            color: #fff;
            padding: 20px 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 a {
            color: #fff;
            text-decoration: none;
            font-size: 24px;
        }
        header h1 a span { color: #f5a623; }
        header nav a {
            color: #ccc;
            text-decoration: none;
            margin-left: 20px;
            transition: color 0.2s;
        }
        header nav a:hover { color: #f5a623; }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
        }
        main {
            padding: 40px 0;
            min-height: calc(100vh - 200px);
        }
        footer {
            background: #1a1f2e;
            color: #999;
            text-align: center;
            padding: 20px 0;
            font-size: 14px;
        }
        a { color: #0066cc; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .breadcrumb {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
        }
        .breadcrumb a { color: #0066cc; }
        .breadcrumb span { color: #1d1d1f; font-weight: 500; }

        .sections-list, .subsections-list, .topics-list {
            list-style: none;
            padding: 0;
        }
        .sections-list li, .subsections-list li, .topics-list li {
            background: #fff;
            padding: 15px 20px;
            margin-bottom: 10px;
            border-radius: 8px;
            border: 1px solid #e5e5e7;
            transition: box-shadow 0.2s;
        }
        .sections-list li:hover, .subsections-list li:hover, .topics-list li:hover {
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .sections-list a, .subsections-list a, .topics-list a {
            font-size: 18px;
            font-weight: 500;
        }
        .topic-meta, .post-date, .topic-info {
            font-size: 13px;
            color: #666;
            margin-top: 5px;
        }
        .badge {
            display: inline-block;
            font-size: 12px;
            margin-right: 5px;
        }
        .post {
            background: #fff;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #e5e5e7;
        }
        .post-author {
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
        .description {
            color: #555;
            margin-bottom: 20px;
        }
        h3 {
            margin-top: 30px;
            margin-bottom: 15px;
            font-size: 18px;
            color: #333;
        }
        /* Формы авторизации */
        .auth-form {
            max-width: 450px;
            margin: 40px auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            border: 1px solid #e5e5e7;
            box-shadow: 0 2px 12px rgba(0,0,0,0.05);
        }
        .auth-form h2 {
            margin-bottom: 25px;
            font-size: 24px;
        }
        .form-field { margin-bottom: 18px; }
        .form-field label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 6px;
            color: #333;
        }
        .form-field input {
            width: 100%;
            padding: 10px 12px;
            font-size: 15px;
            border: 1px solid #d1d1d6;
            border-radius: 6px;
            transition: border 0.2s;
            font-family: inherit;
        }
        .form-field input:focus {
            outline: none;
            border-color: #0066cc;
            box-shadow: 0 0 0 3px rgba(0,102,204,0.1);
        }
        .help-text {
            display: block;
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }
        .field-error {
            color: #d32f2f;
            font-size: 13px;
            margin-top: 5px;
        }
        .error-box {
            background: #ffebee;
            color: #c62828;
            padding: 12px 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            border-left: 4px solid #c62828;
        }
        .btn-primary {
            background: #0066cc;
            color: #fff;
            border: none;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
            font-family: inherit;
        }
        .btn-primary:hover { background: #0052a3; }
        .auth-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }
        .user-info { color: #ccc; margin-right: 10px; }
        .notice {
            background: #fff3e0;
            color: #e65100;
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .logout-btn {
            background: none;
            border: none;
            color: #ccc;
            cursor: pointer;
            font-size: inherit;
            font-family: inherit;
            padding: 0;
            margin-left: 20px;
            transition: color 0.2s;
        }
        .logout-btn:hover { color: #f5a623; }

       /* Quill 2.x code-block */
        .post-content .ql-code-block-container {
            background: #2d2d2d !important;
            color: #f8f8f2;
            padding: 15px 20px;
            border-radius: 6px;
            overflow-x: auto;
            margin: 15px 0;
        }
        .post-content .ql-code-block {
            background: transparent !important;
            color: #f8f8f2 !important;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        /* Quill — редактор (контрастная тема) */
        .ql-toolbar.ql-snow {
            background: #f8f9fa;
            border: 1px solid #d1d1d6;
            border-radius: 6px 6px 0 0;
            padding: 8px 12px;
        }
        .ql-container.ql-snow {
            background: #ffffff;
            border: 1px solid #d1d1d6;
            border-top: none;
            border-radius: 0 0 6px 6px;
            font-size: 15px;
            min-height: 300px;
        }
        .ql-editor {
            color: #1d1d1f;
            min-height: 250px;
        }
        .ql-editor.ql-blank::before {
            color: #999;
            font-style: normal;
        }
        .ql-snow .ql-stroke { stroke: #444; }
        .ql-snow .ql-fill,
        .ql-snow .ql-stroke.ql-fill { fill: #444; }
        .ql-snow .ql-picker { color: #444; }
        .ql-snow .ql-picker-options {
            background: #fff;
            border: 1px solid #d1d1d6;
        }
        .ql-snow .ql-picker-item { color: #444; }
        .ql-snow button:hover .ql-stroke,
        .ql-snow button.ql-active .ql-stroke { stroke: #0066cc; }
        .ql-snow button:hover .ql-fill,
        .ql-snow button.ql-active .ql-fill { fill: #0066cc; }
        .ql-snow .ql-picker-label:hover,
        .ql-snow .ql-picker-label.ql-active { color: #0066cc; }
        .ql-snow .ql-picker-label:hover .ql-stroke,
        .ql-snow .ql-picker-label.ql-active .ql-stroke { stroke: #0066cc; }
        .ql-editor a { color: #0066cc; }
        .ql-editor blockquote {
            border-left: 4px solid #f5a623;
            padding-left: 15px;
            margin: 10px 0;
            color: #555;
        }
        .ql-editor pre.ql-syntax {
            background: #2d2d2d !important;
            color: #f8f8f2 !important;
            border-radius: 6px;
            padding: 12px 15px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 14px;
        }
        /* Выравнивание в Quill */
        .ql-editor .ql-align-center,
        .post-content .ql-align-center { text-align: center; }
        .ql-editor .ql-align-right,
        .post-content .ql-align-right { text-align: right; }
        .ql-editor .ql-align-justify,
        .post-content .ql-align-justify { text-align: justify; }
        /* Страница профиля */
        .profile-page {
            max-width: 900px;
            margin: 0 auto;
        }
        .profile-banner {
            height: 200px;
            border-radius: 12px;
            margin-bottom: -60px;
        }
        .profile-header {
            display: flex;
            align-items: flex-end;
            gap: 20px;
            padding: 0 30px;
            margin-bottom: 30px;
        }
        .profile-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #1a1f2e;
            color: #f5a623;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: 700;
            border: 4px solid #f5f5f7;
            flex-shrink: 0;
        }
        .profile-info {
            padding-bottom: 10px;
        }
        .profile-info h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }
        .profile-role {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        .profile-status {
            color: #666;
            font-style: italic;
            margin-bottom: 8px;
        }
        .profile-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            font-size: 13px;
            color: #666;
        }
        .profile-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
            padding: 0 30px;
        }
        .stat-box {
            background: #fff;
            border: 1px solid #e5e5e7;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }
        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: #0066cc;
        }
        .stat-label {
            font-size: 13px;
            color: #666;
            margin-top: 5px;
        }
        .profile-section {
            background: #fff;
            border: 1px solid #e5e5e7;
            border-radius: 8px;
            padding: 20px 25px;
            margin-bottom: 20px;
            margin-left: 30px;
            margin-right: 30px;
        }
        .profile-section h3 {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 16px;
            color: #333;
        }
        .profile-topics {
            list-style: none;
            padding: 0;
        }
        .profile-topics li {
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .profile-topics li:last-child {
            border-bottom: none;
        }
        .social-link {
            display: inline-block;
            background: #f0f0f0;
            color: #333;
            padding: 6px 14px;
            border-radius: 6px;
            margin-right: 10px;
            font-size: 14px;
            transition: background 0.2s;
        }
        .social-link:hover {
            background: #e0e0e0;
            text-decoration: none;
        }

        /* Адаптив */
        @media (max-width: 768px) {
            .profile-header {
                flex-direction: column;
                align-items: center;
                text-align: center;
                padding: 0 15px;
            }
            .profile-meta {
                justify-content: center;
            }
            .profile-stats {
                grid-template-columns: 1fr;
                padding: 0 15px;
            }
            .profile-section {
                margin-left: 15px;
                margin-right: 15px;
            }
        }
        .profile-actions {
            margin-left: auto;
            padding-bottom: 15px;
        }
        .btn-edit {
            display: inline-block;
            background: #0066cc;
            color: #fff;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 14px;
            text-decoration: none;
            transition: background 0.2s;
        }
        .btn-edit:hover {
            background: #0052a3;
            text-decoration: none;
        }
        @media (max-width: 768px) {
            .profile-actions {
                margin-left: 0;
                width: 100%;
                text-align: center;
                margin-top: 15px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1><a href="/">Code<span>Nest</span></a></h1>
            <nav>
                <a href="/">Главная</a>
                {% if user.is_authenticated %}
                    <span class="user-info">Привет, <strong>{{ user.username }}</strong></span>
                    {% if user.is_staff %}
                        <a href="/admin/">Админка</a>
                    {% endif %}
                    <form method="post" action="{{ url('logout') }}" style="display:inline;">
                        {{ csrf_input|safe }}
                        <button type="submit" class="logout-btn">Выйти</button>
                    </form>
                {% else %}
                    <a href="{{ url('login') }}">Войти</a>
                    <a href="{{ url('forum:register') }}">Регистрация</a>
                {% endif %}
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer>
        <div class="container">
            © 2026 Code Nest - Форум для программистов.
        </div>
    </footer>

    <!-- Quill -->
    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>

    <!-- highlight.js -->
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/languages/python.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/languages/cpp.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/languages/c.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/languages/javascript.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/languages/bash.min.js"></script>

    <!-- Инициализация Quill -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('textarea.editor').forEach(function(el) {
                el.style.display = 'none';

                const editorDiv = document.createElement('div');
                editorDiv.innerHTML = el.value;
                el.parentNode.insertBefore(editorDiv, el);

                const quill = new Quill(editorDiv, {
                    theme: 'snow',
                    placeholder: el.placeholder || 'Напишите что-нибудь...',
                    modules: {
                        toolbar: [
                            [{ 'header': [1, 2, 3, false] }],
                            ['bold', 'italic', 'underline', 'strike'],
                            [{ 'list': 'ordered' }, { 'list': 'bullet' }],
                            [{ 'align': [] }],
                            ['blockquote', 'code-block'],
                            ['link', 'image'],
                            ['clean']
                        ]
                    }
                });

                function syncContent() {
                    el.value = quill.root.innerHTML;
                }

                quill.on('text-change', syncContent);

                const form = el.closest('form');
                if (form) {
                    form.addEventListener('submit', syncContent);
                }
            });
        });
    </script>

    <!-- Подсветка кода: Quill сохраняет <pre>, а не <pre><code>, поэтому оборачиваем -->
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        // 1. Обрабатываем Quill 2.x code blocks (div.ql-code-block)
        document.querySelectorAll('.post-content .ql-code-block').forEach(function(block) {
            // Создаём <pre><code> для highlight.js
            const code = document.createElement('code');
            code.className = 'language-c';  // по умолчанию C (Pawn похож на C)
            code.textContent = block.textContent;
            hljs.highlightElement(code);
            block.innerHTML = '';
            block.appendChild(code);
        });

        // 2. Обрабатываем классические <pre> (если есть)
        document.querySelectorAll('.post-content pre').forEach(function(pre) {
            if (pre.querySelector('code')) {
                hljs.highlightElement(pre.querySelector('code'));
                return;
            }
            const code = document.createElement('code');
            code.className = 'language-c';
            code.textContent = pre.textContent;
            hljs.highlightElement(code);
            pre.innerHTML = '';
            pre.appendChild(code);
        });

        // 3. Обрабатываем блоки в редакторе Quill (для предпросмотра)
        document.querySelectorAll('.ql-editor .ql-code-block').forEach(function(block) {
            const code = document.createElement('code');
            code.className = 'language-c';
            code.textContent = block.textContent;
            hljs.highlightElement(code);
            block.innerHTML = '';
            block.appendChild(code);
        });
    });

            // 2. В редакторе Quill (предпросмотр)
            document.querySelectorAll('.ql-editor pre').forEach(function(pre) {
                if (pre.querySelector('code')) return;
                const code = document.createElement('code');
                code.innerHTML = pre.innerHTML;
                pre.innerHTML = '';
                pre.appendChild(code);
                code.className = 'language-c';
                hljs.highlightElement(code);
            });
    </script>
</body>
</html>
