<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Code Nest{% endblock %}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f7;
            color: #1d1d1f;
            line-height: 1.6;
        }
        header {
            background: #1a1f2e;
            color: #fff;
            padding: 20px 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 a {
            color: #fff;
            text-decoration: none;
            font-size: 24px;
        }
        header h1 a span {
            color: #f5a623
        }
        header nav a {
            color: #ccc;
            text-decoration: none;
            margin-left: 20px;
            transition: color 0.2s;
        }
        header nav a:hover { color: #f5a623; }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
        }
        main {
            padding: 40px 0;
            min-height: calc(100vh - 200px);
        }
        footer {
            background: #1a1f2e;
            color: #999;
            text-align: center;
            padding: 20 px 0;
            font-size: 14px;
        }
        a { color: #0066cc; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .breadcrumb {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
        }
        .breadcrumb a { color: #0066cc; }
        .breadcrumb span { color: #1d1d1f; font-weight: 500; }

        .sections-list, .subsections-list, .topics-list {
            list-style: none;
            padding: 0;
        }
        .sections-list li, .subsections-list li, .topics-list li {
            background: #fff;
            padding: 15px 20px;
            margin-bottom: 10px;
            border-radius: 8px;
            border: 1px solid #e5e5e7;
            transition: box-shadow 0.2s;
        }
        .sections-list li:hover, .subsections-list li:hover, .topics-list li:hover {
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .sections-list a, .subsections-list a, .topics-list a {
            font-size: 18px;
            font-weight: 500;
        }
        .topic-meta, .post-date, .topic-info {
            font-size: 13px;
            color: #666;
            margin-top: 5px;
        }
        .badge {
            display: inline-block;
            font-size: 12px;
            margin-right: 5px;
        }
        .post {
            background: #fff;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #e5e5e7;
        }
        .post-author {
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
        .description {
            color: #555;
            margin-bottom: 20px;
        }
        h3 {
            margin-top: 30px;
            margin-bottom: 15px;
            font-size: 18px;
            color: #333;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1><a href="/">Code<span>Nest</span></a></h1>
            <nav>
                <a href="/">Главная</a>
                <a href="/admin/">Админка</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer>
        <div class="container">
            © 2026 Code Nest - Форум для программистов.
        </div>
    </footer>
</body>
</html>
