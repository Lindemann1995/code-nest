{% extends "base.html" %}

{% block title %}Удаление сообщения — Code Nest{% endblock %}

{% block content %}
<div class="auth-form" style="max-width: 600px;">
    <h2>Удалить сообщение?</h2>
    <p style="color: #666; margin-bottom: 20px;">
        Тема: <strong>{{ topic.title }}</strong>
    </p>

    <div style="background: #f8f9fa; padding: 15px; border-radius: 6px; margin-bottom: 20px;">
        {{ post.content|safe }}
    </div>

    <p style="color: #d32f2f; margin-bottom: 20px;">
        ⚠️ Это действие <strong>нельзя отменить</strong>.
    </p>

    <form method="post">
        {{ csrf_input|safe }}
        <div style="display: flex; gap: 10px;">
            <button type="submit" class="btn-primary" style="background: #d32f2f;">
                Удалить
            </button>
            <a href="{{ url('forum:topic', kwargs={'section_slug': topic.section.slug, 'slug': topic.slug}) }}"
               class="btn-primary"
               style="background: #999; text-decoration: none; text-align: center; line-height: 1.4;">
                Отмена
            </a>
        </div>
    </form>
</div>
{% endblock %}
